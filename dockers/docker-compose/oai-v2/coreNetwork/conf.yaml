    oaiHss:
      snap:
        description: "snap of oai-hss"
        name: "oai-hss"
        channel: "edge"
        devmode: true
        refresh: false
        plugs: [home, network, desktop, mount-observe, process-control, network-control,
          network-observe, network-bind]
      databaseServiceName: "cassandra"
    oaiMme:
      snap:
        description: "snap of oai-mme"
        name: "oai-mme"
        channel: "edge"
        devmode: true
        refresh: false
        plugs: [mount-observe, system-backup, process-control, network-control, network-observe,
          network-bind, network]
      mcc: "208"
      mnc: "95"
    oaiSpgwc:
      snap:
        description: "snap of oai-spgwc"
        name: "oai-spgwc"
        channel: "edge"
        devmode: true
        refresh: false
        plugs: [log-observe, process-control, network-control, network-observe, network-bind]
      dns: "8.8.8.8"       # DNS of your network
    oaiSpgwu:
      snap:
        description: "snap of oai-spgwu"
        name: "oai-spgwu"
        channel: "edge"
        devmode: true
        refresh: false
        plugs: [log-observe, process-control, firewall-control, network-control, network-observe,
          network-bind]
