oaiCn:
  v2:
  - realm:
      description: "Realm of oai"
      default: "openair5G.eur"
    APN_NI:
      description: |
        APN of your network. Currently only one API is supported which will replace the default value of 
        the first api (oai.openair5G.eur) to the defined value
      default: "oai.ipv4"
