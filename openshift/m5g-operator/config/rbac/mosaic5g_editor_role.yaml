# This rule is not used by the project m5g-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the mosaic5g.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: m5g-operator
    app.kubernetes.io/managed-by: kustomize
  name: mosaic5g-editor-role
rules:
- apiGroups:
  - mosaic5g.com
  resources:
  - mosaic5gs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - mosaic5g.com
  resources:
  - mosaic5gs/status
  verbs:
  - get
