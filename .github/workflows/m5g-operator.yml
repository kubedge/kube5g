name: m5g-operator

on:
  push:
    paths:
      - "openshift/m5g-operator/**"
      - ".github/workflows/m5g-operator.yml"
  pull_request:
    paths:
      - "openshift/m5g-operator/**"
      - ".github/workflows/m5g-operator.yml"

permissions: {}

defaults:
  run:
    working-directory: openshift/m5g-operator

jobs:
  lint:
    permissions:
      contents: read
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: openshift/m5g-operator/go.mod

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint

  test:
    permissions:
      contents: read
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: openshift/m5g-operator/go.mod

      - name: Running Tests
        run: make test

      - name: Generated files are up to date
        run: git diff --exit-code

  test-e2e:
    permissions:
      contents: read
    name: E2E tests (kind)
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: openshift/m5g-operator/go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Running Test e2e
        run: make test-e2e
